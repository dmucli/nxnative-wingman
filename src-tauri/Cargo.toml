[package]
name = "wingman"
version = "0.1.0"
edition = "2021"
description = "Wingman: play nxnative Switch games with a HOTAS"
license = "MIT"
repository = "https://github.com/dmucli/nxnative-wingman"

[lib]
name = "wingman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-foundation = "0.10"
